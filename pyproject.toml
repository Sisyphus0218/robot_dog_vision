[project]
name = "robot-dog-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hyf", email = "houyufan20@mails.ucas.ac.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.4.1",
    "huggingface-hub>=2.1.1",
    "hydra-core>=1.3.7",
    "lap>=0.5.12",
    "mediapipe>=1.1.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "primesense>=2.2.0.30.post5",
    "pyrealsense2>=2.58.4.10922",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torchreid>=0.2.5",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.174",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_dog_vision"]

[project.optional-dependencies]
cpu = [
    "torch==2.6.0",
    "torchvision==0.21.0",
]

cu130 = [
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
